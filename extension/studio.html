<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAMEET · 视频壁纸工作室</title><link rel="stylesheet" href="style.css"></head>
<body class="studio"><header><a class="brand" href="studio.html" aria-label="FRAMEET 壁纸工作室"><img class="brand-logo" src="assets/frameet-logo.svg" alt="FRAMEET" width="117" height="32"><sup>VIDEO WALLPAPER <span class="sui">S</span>T<span class="sui">U</span>D<span class="sui">I</span>O</sup></a><div class="header-actions"><span class="local-badge">● 自动保存</span><button id="export" class="primary">导出壁纸 ↓</button></div></header>
<main><aside><div id="projectPicker" class="project-picker"></div><div class="tabs"><button class="tab active" data-tab="design">01 版式</button><button class="tab" data-tab="collection">02 照片库</button><button class="tab" data-tab="words">03 文字 / 贴纸</button></div>
<section id="collection" hidden><div class="section-label">照片库 <span id="count">0</span></div>
<div class="library-categories" role="tablist" aria-label="照片分类"><button data-library="current" role="tab" aria-selected="true">当前 <span id="currentCount">0</span></button><button data-library="deleted" role="tab" aria-selected="false">已删除 <span id="deletedCount">0</span></button><button id="sortColor" title="按照片主色估算排序，可再手动调整">按色系排序</button></div><div class="library-toolbar" aria-label="照片整理"><button id="multiSelect" class="secondary" aria-pressed="false">多选</button><button id="selectAll" class="secondary">全选</button><button id="delete" class="danger" disabled>删除</button><button id="undo" class="secondary" disabled>撤销删除</button><span id="selectionCount" aria-live="polite">未选照片</span></div>
<div id="polaroidSelection" hidden><p id="polaroidInfo" class="hint"></p><button id="usePolaroid" class="secondary" disabled>选中 N 张，一键排版</button></div>
<input id="import" type="file" accept="image/*" multiple hidden><div id="frames" class="frame-grid"></div><p id="empty" class="hint" hidden>暂无已删除照片。</p>
<details id="cropDetails"><summary>裁切与顺序 <span id="cropLabel">先选择一张照片</span></summary><div id="crop" hidden><label>放大 <input id="zoom" type="range" min="1" max="3" step="0.05"></label><label>左右 <input id="focusX" type="range" min="0" max="1" step="0.01"></label><label>上下 <input id="focusY" type="range" min="0" max="1" step="0.01"></label><div class="button-row"><button id="moveLeft" class="secondary">向前</button><button id="moveRight" class="secondary">向后</button></div><p id="frameInfo" class="hint"></p></div></details></section>
<section id="design"><div class="section-label">选择版式</div><div class="template-options"><button class="template-option active" data-template="film"><img class="template-mini" src="assets/template-film.svg" alt="" width="62" height="46"><b>胶片 Film</b><small>适合超超超多图排版，把所有心动都定格</small></button><button class="template-option" data-template="polaroid"><img class="template-mini" src="assets/template-polaroid.svg" alt="" width="62" height="46"><b>拍立得 Polaroid</b><small>适合1–6张图排版，留下几张私心偏爱</small></button><button class="template-option" data-template="simple"><img class="template-mini" src="assets/template-simple.svg" alt="" width="62" height="46"><b>简单拼接 Simple</b><small>适合少量照片，同色系干净拼接</small></button></div>
<label>壁纸尺寸<select id="device" aria-label="壁纸设备"><option value="desktop">电脑</option><option value="phone">手机</option><option value="ipad">iPad</option></select></label><label>具体尺寸<select id="resolution"><option value="1920x1080">1920 × 1080 · 桌面</option><option value="2560x1440">2560 × 1440 · 2K</option><option value="3840x2160">3840 × 2160 · 4K</option></select></label><p id="ipadSizeHint" class="hint" hidden>按机型选择横屏或竖屏。</p>
<div id="filmControls"><label>每行照片<select id="columns"><option value="auto">自动适配</option><option value="3">3 张</option><option value="4">4 张</option><option value="5">5 张</option><option value="6">6 张</option></select></label><label>照片间距<input id="gap" type="range" min="4" max="22" value="9"></label><label class="check"><input id="grain" type="checkbox" checked> 胶片颗粒</label><label class="check"><input id="offset" type="checkbox" checked> 错位排列</label></div>
<div id="polaroidControls" hidden><label>拍立得照片数（1~6）<input id="polaroidCount" type="number" min="1" max="6" step="1" value="6"></label><div class="section-label">背景</div><label class="upload">＋ 上传背景图片<input id="backgroundUpload" type="file" accept="image/*" hidden></label><div class="button-row"><input id="backgroundColor" type="color" value="#8ba6a0" aria-label="背景颜色"><button id="removeBackground" class="secondary">恢复默认背景</button></div><p id="backgroundInfo" class="hint">也可以只选一个喜欢的背景色。</p></div><div id="simpleControls" hidden><label>拼接照片数量<input id="simpleCount" type="number" min="1" max="6" step="1" value="3"></label><label>拼接方向<select id="simpleDirection"><option value="auto">随横竖屏自动拼接</option><option value="vertical">上下拼接</option><option value="horizontal">左右拼接</option><option value="grid">均匀网格</option></select></label><label>黑边 / 间距<input id="simpleGap" type="range" min="0" max="60" value="22"></label></div></section>
<section id="words" hidden><div id="polaroidWords" hidden><div class="section-label">相纸文字</div><p class="hint">文字随相纸移动，自动换行缩小。</p><div id="polaroidCaptions"></div></div>
<div id="filmWords"><div class="section-label">手写文字</div><textarea id="copy" rows="4" maxlength="1200" placeholder="输入你想写的话，每行一条（可留空）"></textarea><p id="copyCount" class="hint">0 / 10 条</p></div>
<label>文字样式<select id="textStyle"><option value="handwrite">随性手写</option><option value="marker">粗头马克笔</option><option value="sketch">素描花字</option><option value="crayon">手绘蜡笔 · 颗粒笔触</option></select></label>
<div class="section-label">增加贴纸</div><div class="sticker-palette"><button data-sticker="heart">♡ 爱心</button><button data-sticker="star">☆ 星星</button><button data-sticker="arrow">↗ 箭头</button><button data-sticker="crown">♛ 皇冠</button></div>
<div id="decorationControls"><label>大小<input id="decoSize" type="range" min="0.3" max="3" step="0.05" disabled></label><label>旋转<input id="decoAngle" type="range" min="-180" max="180" disabled></label><label id="inkControl">颜色<input id="ink" type="color" value="#f7ee55" aria-label="颜色"></label><button id="removeDeco" class="secondary" disabled>移除选中的文字或贴纸</button></div></section>
<footer class="creator-footer">@传闻中的穗穗</footer></aside>
<article><div class="preview-top"><span><i class="live-dot"></i> 壁纸预览</span><span id="sizeLabel">1920 × 1080</span></div><div id="cardControlsRow" hidden><div id="cardControls"><span id="cardLabel">选择一张拍立得</span><label>大小 <input id="cardScale" type="range" min="0.5" max="1.8" step="0.01" value="1"></label><button id="resetCard" class="secondary">重置此张</button></div></div><div id="previewStage"><div id="canvasWrap"><canvas id="canvas" width="1920" height="1080" aria-label="壁纸预览，可拖动文字及贴纸"></canvas><div id="previewEmpty"><b>Your favorite frames,<br><em>all in one place.</em></b><span>把刚刚心动的画面，做成每天都能看到的壁纸。</span></div></div></div><div class="preview-bottom"><span id="previewCount">0 张照片 / 胶片</span><span>PNG · 无水印</span></div><p id="status" role="status">准备好了，先截几张喜欢的画面。</p></article></main><script type="module" src="studio.js"></script></body></html>
