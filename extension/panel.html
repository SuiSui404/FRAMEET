<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAMEET · 视频截图</title><link rel="stylesheet" href="style.css">
<body class="panel"><div class="eyebrow">FRAMEET</div><h1>把<em>心动的一帧</em><br>留在桌面上。</h1><p class="panel-description">边看边截图，挑好照片就能拼壁纸。</p><div id="projectPicker" class="project-picker"></div>
<button class="primary" id="capture">截图</button><div class="capture-options"><button class="secondary" id="fallback" title="截取整个播放器在屏幕上的画面">截取全部</button><button class="secondary" id="region" title="拖动选区，只截想要的部分，也适用于嵌入播放器">框选局部</button></div>
<div class="section-label">已存的照片 <span id="count">0</span></div><div class="library-categories" role="tablist" aria-label="照片分类"><button data-library="current" role="tab" aria-selected="true">当前 <span id="currentCount">0</span></button><button data-library="deleted" role="tab" aria-selected="false">已删除 <span id="deletedCount">0</span></button></div><div id="frames" class="panel-grid"></div><p id="panelEmpty" class="hint" hidden></p><p id="status" role="status" class="hint"></p>
<button class="primary" id="open">制作壁纸 ↗</button><p class="quick-guide">本机保存 · 无需账号 · 无水印导出</p><footer class="creator-footer">@传闻中的穗穗｜Bilibili REDnote</footer><script type="module" src="panel.js"></script></body></html>
